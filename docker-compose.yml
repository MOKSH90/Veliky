# ==============================================================================
# VELIKY — Sovereign Autonomous Agentic AI Workbench
# Complete Multi-Service Container Orchestration
# ==============================================================================

services:
  # ============================================================================
  # 1. Local Open-Weight Model Inference Server (OpenAI-Compatible API)
  # Serves /v1/models and /v1/chat/completions on port 8000
  # ============================================================================
  model-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.model
    image: veliky-model-server:latest
    container_name: veliky-model-server
    environment:
      - MODEL_NAME=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - SERVE_HOST=0.0.0.0
      - PORT=8000
      - DEVICE=auto
      - TORCH_DTYPE=auto
    ports:
      - "8000:8000"
    volumes:
      - veliky_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - veliky-net

  # ============================================================================
  # 2. Sovereign Gateway & Execution Sandbox Service
  # FastMCP Bridge, Bubblewrap Sandbox, Obsidian Vault, and Policy Gate
  # ============================================================================
  veliky-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: veliky-gateway:latest
    container_name: veliky-gateway
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - VELIKY_GATEWAY_HOST=0.0.0.0
      - VELIKY_GATEWAY_PORT=8766
      - VELIKY_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,veliky-gateway,veliky-web,model-server
      - VELIKY_ALLOW_ALL_HOSTS=1
      - INFERENCE_ENDPOINT=http://model-server:8000/v1
      - VELIKY_REASONING_ENDPOINT=http://model-server:8000/v1
      - VELIKY_REASONING_MODEL=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - VELIKY_CODING_ENDPOINT=http://model-server:8000/v1
      - VELIKY_CODING_MODEL=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - VELIKY_VISION_ENDPOINT=http://model-server:8000/v1
      - VELIKY_VISION_MODEL=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - MODEL_NAME=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - VELIKY_RAG_DIR=/app/tflite/RAG
      - VAULT_DIR=/app/tflite/veliky_vault
      - VELIKY_STATE_DIR=/app/tflite/RAG/state
      - VELIKY_DATA_DIR=/app/tflite/RAG/data
      - VELIKY_ROLE=admin
      - VELIKY_HARNESS_WRITES=1
      - PYTHONUNBUFFERED=1
    ports:
      - "8766:8766"
    volumes:
      - ./tflite/veliky_vault:/app/tflite/veliky_vault
      - veliky_state:/app/tflite/RAG/state
      - veliky_data:/app/tflite/RAG/data
    depends_on:
      model-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8766/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - veliky-net

  # ============================================================================
  # 3. Veliky Web UI & Sovereign SOC Console
  # High-performance Nginx serving Vite React SPA with integrated API/LLM routing
  # ============================================================================
  veliky-web:
    build:
      context: ./Veliky-Web
      dockerfile: Dockerfile
    image: veliky-web:latest
    container_name: veliky-web
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      veliky-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - veliky-net

  # ============================================================================
  # 4. Interactive Agent Terminal CLI
  # Usage: docker compose run --rm veliky-cli chat
  #        docker compose run --rm veliky-cli investigate "Analyze Pump P-204"
  #        docker compose run --rm veliky-cli doctor
  # ============================================================================
  veliky-cli:
    image: veliky-gateway:latest
    container_name: veliky-cli
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
    environment:
      - INFERENCE_ENDPOINT=http://model-server:8000/v1
      - MODEL_NAME=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - VELIKY_ROLE=admin
      - VELIKY_RAG_DIR=/app/tflite/RAG
      - VAULT_DIR=/app/tflite/veliky_vault
    volumes:
      - ./tflite/veliky_vault:/app/tflite/veliky_vault
      - veliky_state:/app/tflite/RAG/state
      - veliky_data:/app/tflite/RAG/data
      - veliky_hf_cache:/root/.cache/huggingface
    depends_on:
      model-server:
        condition: service_healthy
    command: ["chat"]
    profiles:
      - cli
    networks:
      - veliky-net

  # ============================================================================
  # 5. Autonomous Telemetry Watcher Daemon (Optional)
  # Launch with: docker compose --profile watcher up -d
  # ============================================================================
  watcher:
    image: veliky-gateway:latest
    container_name: veliky-watcher
    environment:
      - INFERENCE_ENDPOINT=http://model-server:8000/v1
      - MODEL_NAME=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - VELIKY_ROLE=admin
      - VELIKY_RAG_DIR=/app/tflite/RAG
      - VAULT_DIR=/app/tflite/veliky_vault
    volumes:
      - ./tflite/veliky_vault:/app/tflite/veliky_vault
      - veliky_state:/app/tflite/RAG/state
      - veliky_data:/app/tflite/RAG/data
    depends_on:
      model-server:
        condition: service_healthy
    command: ["python3", "/app/tflite/RAG/veliky_watcher.py"]
    profiles:
      - watcher
    restart: unless-stopped
    networks:
      - veliky-net

volumes:
  # Persistent cache for Hugging Face model weights
  veliky_hf_cache:
    name: veliky_hf_cache
  # Persistent runtime state
  veliky_state:
    name: veliky_state
  # Persistent data store
  veliky_data:
    name: veliky_data

networks:
  veliky-net:
    driver: bridge
    name: veliky-net
