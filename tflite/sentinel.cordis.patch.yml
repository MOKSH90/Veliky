- id: llm-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: plan-mode
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      sentinel-local:
        api: openai-completions
        baseURL: http://127.0.0.1:8000/v1
        apiKeyEnv: SENTINEL_LOCAL_API_KEY
        models:
        - id: Qwen/Qwen2.5-0.5B-Instruct
          contextWindow: 32768
          maxTokens: 4096
          reasoningEfforts: false
- id: agent-default-model
  config:
    provider: sentinel-local
    model: Qwen/Qwen2.5-0.5B-Instruct
- id: system-prompt
  config:
    personaPrefix: 'You are Reinery, an intelligent industrial assistant with access
      to Knowledge Vault documents, sensor telemetry, and calculation tools.

      Converse naturally, helpfully, and concisely with the user.

      When the user greets you (e.g. "hey", "hello", "hi") or asks general conversational
      questions, respond politely and conversationally in plain text. DO NOT invoke
      any tools for simple greetings or chatter.

      Invoke tools when the user asks to retrieve data, perform calculations, or use
      an OS capability:

      - Use mcp__sentinel__read_vault_note or mcp__sentinel__search_documents when
      asked to look up equipment details, inspection reports, or SOPs.

      - Use mcp__sentinel__query_sensor_history when asked for equipment sensor readings
      or telemetry history.

      - Use mcp__sentinel__calculate_metric when asked to perform arithmetic or percentage
      calculations.

      - Only call mcp__sentinel__verify_evidence when the user explicitly asks to
      run or verify a formal investigation report.

      For OS utility actions, use mcp__sentinel__request_capability first. Never request
      shell access.

      Never fabricate data or cite non-existent sources.

      '
- id: approval
  config:
    policy: ask
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: /home/lucifer/Projects/Tflite/Sentinel/tflite
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
    defaultPreset: read-only
- insert:
  - id: sentinel-policy
    name: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/harness/policy.mjs
  - id: mcp-sentinel
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: sentinel
      transport: stdio
      command: /home/lucifer/Projects/Tflite/Sentinel/tflite/.venv/bin/python
      args:
      - /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/sentinel_mcp_server.py
      cwd: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG
      failOnStartupError: true
      toolCallTimeoutMs: 240000
      env:
        PYTHONUNBUFFERED: '1'
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        HF_HUB_DISABLE_TELEMETRY: '1'
        SENTINEL_ROLE: analyst
        SENTINEL_RETRIEVAL: hybrid
        VAULT_DIR: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/sentinel_vault
        INDEX_DIR: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/index_store
        MILVUS_URI: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/index_store/milvus.db
        SENTINEL_DATA_DIR: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/data
        SENTINEL_STATE_DIR: /home/lucifer/Projects/Tflite/Sentinel/tflite/RAG/state
        SENTINEL_HARNESS_WRITES: '1'
        SENTINEL_CAPABILITIES_ONLY: '0'
        SENTINEL_EXTENSION_ENDPOINT: http://127.0.0.1:8000/v1
        SENTINEL_EXTENSION_MODEL: Qwen/Qwen2.5-0.5B-Instruct
        SENTINEL_ALLOW_SELF_EXTENSION: '0'
        SENTINEL_CAPABILITY_RISK: low
